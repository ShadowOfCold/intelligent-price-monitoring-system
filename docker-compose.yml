services:
  postgres:
    image: postgres:16
    container_name: price_monitoring_db
    environment:
      POSTGRES_DB: price_monitoring_db
      POSTGRES_USER: price_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: price_monitoring_backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/assets:/app/backend/assets
    depends_on:
      - postgres

  frontend:
    build: .
    container_name: price_monitoring_frontend
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env.docker
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data: